name: statpy_env

channels:
 - conda-forge
 - bioconda

dependencies:
 - conda-forge::python=3.11.5
 - conda-forge::tqdm=4.66.1
 - conda-forge::numpy=1.26.4
 - conda-forge::pandas=1.5.3
 - conda-forge::scipy=1.12.0
 - conda-forge::seaborn=0.11.2
 - conda-forge::matplotlib
 - conda-forge::nbformat=5.0.8  # >5.1 causes issues with jupyter ("id" tag)
 - conda-forge::jupyter
 - conda-forge::ipykernel
 - conda-forge::nbconvert
 - conda-forge::statannotations==0.5.0
 - conda-forge::mscorefonts
 - pip:
    - PyComplexHeatmap==1.6.6
    - matplotlib_venn